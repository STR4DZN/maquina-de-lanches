<!doctype html><html><style>body{margin:0;display:flex}iframe{width:1000px;height:1050px;flex-shrink:0;border:0}</style><script>
window.shopServer={users:[{id:'master',name:'Mestre',isGM:true,role:4,active:true,viewedScene:'scene'},{id:'a',name:'Astra',isGM:false,role:1,active:true,viewedScene:'scene'},{id:'b',name:'Vega',isGM:false,role:1,active:true,viewedScene:'scene'}],clients:new Map(),regions:new Map(),ledger:{schema:2,sequence:0,pool:{balance:100,revision:0},transactions:[]},messages:new Map(),regionFail:false,ackFail:false,finalFail:false,
 async updateUser(sender,id,change){if(sender!=='master'&&sender!==id)throw Error('user permission');for(const c of this.clients.values())await c.userUpdated(id,change,sender);return null;},
 async setLedger(sender,value){if(sender!=='master')throw Error('GM only');if(this.finalFail&&Object.values(value.purchases||{}).some(p=>p.status==='complete'&&this.ledger.purchases?.[p.id]?.status==='reserved'))throw Error('Final confirmation failed');this.ledger=structuredClone(value);for(const c of this.clients.values())await c.ledgerUpdated(structuredClone(value));return value;},
 async updateRegion(sender,id,change){if(sender!=='master')throw Error('GM only');if(this.regionFail)throw Error('Region storage unavailable');const r=this.regions.get(id);for(const [path,value]of Object.entries(change)){if(path.startsWith('flags.')){const [,scope,key]=path.split('.');r.flags??={};r.flags[scope]??={};r.flags[scope][key]=structuredClone(value);}else r[path]=structuredClone(value);}for(const c of this.clients.values())await c.regionUpdated(structuredClone(r),sender);if(this.ackFail){this.ackFail=false;throw Error('Stock ack lost');}return r;},
 async createRegions(sender,data){if(sender!=='master')throw Error('GM only');const result=[];for(const value of data){const r={...value,id:crypto.randomUUID().replaceAll('-','').slice(0,16),elevation:value.elevation||{bottom:null,top:null},flags:value.flags||{}};this.regions.set(r.id,r);for(const c of this.clients.values())await c.regionUpdated(structuredClone(r),sender,true);result.push(this.clients.get(sender).scene.regions.get(r.id));}return result;},
 async deleteRegion(sender,id){if(sender!=='master')throw Error('GM only');this.regions.delete(id);for(const c of this.clients.values())await c.regionDeleted(id);},
 async chat(sender,payload){if(payload.whisper?.length)throw Error('No private payment chats');if(this.messages.has(payload._id))throw Error('Duplicate chat');this.messages.set(payload._id,structuredClone(payload));for(const c of this.clients.values())await c.chatAdded(payload);return payload;}
};
</script><iframe name="master" src="/client?user=master"></iframe><iframe name="a" src="/client?user=a"></iframe><iframe name="b" src="/client?user=b"></iframe></html>
